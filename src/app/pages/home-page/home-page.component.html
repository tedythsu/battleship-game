<main class="main-container">
  <header>
    <h2>SELECT A GAME MODE</h2>
  </header>
  <section>
    <ul class="game-mode-list">
      <li class="game-mode-list__item">
        <button class="common-btn" disabled aria-describedby="solo-hint">SOLO</button>
        <p class="coming-soon-label" id="solo-hint">COMING SOON</p>
      </li>
      <li class="game-mode-list__item">
        <button class="common-btn" (click)="navigateToOnline()">ONLINE BATTLE</button>
      </li>
    </ul>
  </section>
</main>
